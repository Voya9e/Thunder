<%+header%>
<h2><%:迅雷日志%></h2>
<div class="cbi-section">
	<h3><%:服务日志%></h3>
	<% if log and log ~= "" then %>
	<pre style="max-height: 28em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;"><%=luci.util.pcdata(log)%></pre>
	<% else %>
	<p><%:暂无服务日志。%></p>
	<% end %>
	<h3><%:迅雷核心日志%></h3>
	<% if core_log and core_log ~= "" then %>
	<pre style="max-height: 28em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;"><%=luci.util.pcdata(core_log)%></pre>
	<% else %>
	<p><%:暂无核心日志。%></p>
	<% end %>
</div>
<%+footer%>
